<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Off-grid | Inloggen</title>
<style>
:root{--ink:#151A21;--muted:#3D4A5C;--line:#D3DCE5;--paper:#EEF2F6;--pink:#e5007d}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:linear-gradient(120deg,#EEF6DE 0%,#E4F2EE 35%,#E0EEF8 70%,#F4F8FB 100%);padding:20px}
.box{background:#fff;border:1px solid var(--line);border-radius:0;padding:32px 28px;width:100%;max-width:380px}
.box img{display:block;width:220px;max-width:100%;height:auto;margin:0 0 22px}
h1{font-size:20px;margin:0 0 4px}
p.sub{margin:0 0 22px;color:var(--muted);font-size:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
input[type=password]{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
label.chk{display:flex;align-items:center;gap:8px;margin:14px 0 18px;font-size:14px;color:var(--muted)}
label.chk input{accent-color:var(--pink)}
button{width:100%;font:inherit;font-weight:700;font-size:16px;border:0;border-radius:4px;padding:12px;background:var(--pink);color:#fff;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
#err{min-height:20px;margin:12px 0 0;font-size:14px;color:#b0004f}
</style>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const tob64 = u => { let s=''; for (let i=0;i<u.length;i+=0x8000) s += String.fromCharCode.apply(null, u.subarray(i,i+0x8000)); return btoa(s); };
const LOGOUT = '<button id="og-logout" onclick="try{localStorage.removeItem(\'' + STORE + '\')}catch(e){};location.reload()" style="position:fixed;right:14px;bottom:14px;z-index:99;font:600 13px system-ui,sans-serif;padding:8px 12px;border:1px solid #cfd6d6;border-radius:4px;background:#fff;color:#18212e;cursor:pointer">Uitloggen</button><style>@media print{#og-logout{display:none}}</style>';
async function derive(pw){
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.salt), iterations:P.iter, hash:'SHA-256'}, k, {name:'AES-GCM', length:256}, true, ['decrypt']);
}
async function openTool(key){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.iv)}, key, b64(P.data));
  const html = new TextDecoder().decode(pt).replace(/<\/body>/i, LOGOUT + '</body>');
  document.open(); document.write(html); document.close();
}
(async () => {
  try { const raw = localStorage.getItem(STORE); if (raw){ await openTool(await crypto.subtle.importKey('raw', b64(raw), 'AES-GCM', true, ['decrypt'])); return; } }
  catch(e){ try{ localStorage.removeItem(STORE); }catch(_){} }
})();
document.getElementById('login').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('go'), err = document.getElementById('err');
  err.textContent = ''; btn.disabled = true; btn.textContent = 'Bezig met openen…';
  try {
    if (!window.crypto || !crypto.subtle) throw new Error('nocrypto');
    const key = await derive(document.getElementById('pw').value);
    if (document.getElementById('rem').checked){
      try { localStorage.setItem(STORE, tob64(new Uint8Array(await crypto.subtle.exportKey('raw', key)))); } catch(_){}
    }
    await openTool(key);
  } catch(ex){
    btn.disabled = false; btn.textContent = 'Inloggen';
    err.textContent = ex && ex.message==='nocrypto' ? 'Deze browser kan de tool niet openen. Gebruik een https-adres en een recente browser.' : 'Onjuist wachtwoord.';
    try{ localStorage.removeItem(STORE); }catch(_){}
  }
});
