<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Off-grid | Rekentool</title>
<style>
:root{--ink:#151A21;--muted:#3D4A5C;--line:#D3DCE5;--paper:#EEF2F6;--pink:#e5007d}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:linear-gradient(120deg,#EEF6DE 0%,#E4F2EE 35%,#E0EEF8 70%,#F4F8FB 100%);padding:20px}
.box{background:#fff;border:1px solid var(--line);border-radius:0;padding:32px 28px;width:100%;max-width:380px}
.box img{display:block;width:220px;max-width:100%;height:auto;margin:0 0 22px}
h1{font-size:20px;margin:0 0 4px}
p.sub{margin:0 0 22px;color:var(--muted);font-size:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;margin-bottom:14px}
input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink)}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
button{width:100%;font:inherit;font-weight:700;font-size:16px;border:0;border-radius:4px;padding:12px;background:var(--pink);color:#fff;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
button.link{background:none;color:var(--muted);font-weight:600;font-size:13px;padding:8px 0 0;text-decoration:underline}
#msg{min-height:20px;margin:12px 0 0;font-size:14px;color:#b0004f}
#msg.ok{color:#0f766e}
[hidden]{display:none!important}
.fijn{font-size:12px;color:var(--muted);margin:16px 0 0;line-height:1.5}
</style>
</head>
<body>
<main class="box">
  <img src="assets/images/logo-donker.png" alt="Off-grid Energiesystemen">
  <h1>Rekentool</h1>
  <p class="sub">Vul je e-mailadres in. Je krijgt een eenmalige code toegestuurd waarmee je de tool opent.</p>

  <form id="stap1">
    <label class="f">E-mailadres<input type="email" id="email" autocomplete="email" required autofocus
      placeholder="naam@bedrijf.nl"></label>
    <button id="stuur">Stuur mijn code</button>
  </form>

  <form id="stap2" hidden>
    <label class="f">Eenmalige code<input type="text" id="code" inputmode="numeric" pattern="[0-9]*"
      maxlength="6" autocomplete="one-time-code" required placeholder="6 cijfers"></label>
    <button id="open">Tool openen</button>
    <button type="button" class="link" id="terug">Ander e-mailadres</button>
  </form>

  <p id="msg" role="alert"></p>
  <p class="fijn">Je e-mailadres gebruiken we alleen om deze code te sturen en, als je dat wilt,
    om contact op te nemen. De code is 10 minuten geldig en werkt één keer.</p>
</main>

<script>
const API = location.hostname.endsWith("offgridenergiesystemen.nl")
  ? "https://offgrid-vm.tailba5fd4.ts.net/advies" : "";
const $ = id => document.getElementById(id);
const msg = $("msg"), stap1 = $("stap1"), stap2 = $("stap2");
let email = "";

function melding(tekst, ok) {
  msg.textContent = tekst || "";
  msg.className = ok ? "ok" : "";
}

async function post(pad, data) {
  const r = await fetch(API + pad, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(data),
  });
  let uit = {};
  try { uit = await r.json(); } catch (_) {}
  if (!r.ok) throw new Error(uit.error || uit.melding || "Er ging iets mis. Probeer het opnieuw.");
  return uit;
}

stap1.addEventListener("submit", async e => {
  e.preventDefault();
  const knop = $("stuur");
  email = $("email").value.trim();
  knop.disabled = true; knop.textContent = "Bezig…"; melding("");
  try {
    await post("/api/code", {email});
    stap1.hidden = true; stap2.hidden = false;
    melding("Er is een code naar " + email + " gestuurd.", true);
    $("code").focus();
  } catch (ex) {
    melding(ex.message);
  } finally {
    knop.disabled = false; knop.textContent = "Stuur mijn code";
  }
});

$("terug").addEventListener("click", () => {
  stap2.hidden = true; stap1.hidden = false; melding(""); $("code").value = "";
  $("email").focus();
});

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function ontsleutel(blok, code) {
  const basis = await crypto.subtle.importKey("raw", new TextEncoder().encode(code),
    "PBKDF2", false, ["deriveKey"]);
  const sleutel = await crypto.subtle.deriveKey(
    {name: "PBKDF2", salt: b64(blok.salt), iterations: blok.iter, hash: "SHA-256"},
    basis, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  const plat = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(blok.iv)}, sleutel,
    b64(blok.data));
  return new TextDecoder().decode(plat);
}

stap2.addEventListener("submit", async e => {
  e.preventDefault();
  const knop = $("open"), code = $("code").value.trim();
  knop.disabled = true; knop.textContent = "Bezig met openen…"; melding("");
  try {
    if (!window.crypto || !crypto.subtle) throw new Error("Deze browser kan de tool niet openen. Gebruik een recente browser op een https-adres.");
    const uit = await post("/api/controleer", {email, code});
    const html = await ontsleutel(uit.tool, code);
    const uitlog = '<button onclick="location.reload()" style="position:fixed;right:14px;bottom:14px;z-index:99;font:600 13px system-ui,sans-serif;padding:8px 12px;border:1px solid #cfd6d6;border-radius:4px;background:#fff;color:#18212e;cursor:pointer">Uitloggen</button><style>@media print{button[onclick]{display:none}}</style>';
    document.open();
    document.write(html.replace(/<\/body>/i, uitlog + "</body>"));
    document.close();
  } catch (ex) {
    knop.disabled = false; knop.textContent = "Tool openen";
    melding(ex.message);
  }
});
</script>
</body>
</html>
